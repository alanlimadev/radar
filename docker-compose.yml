services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: radar-api
    ports:
      - '${PORT:-3333}:3333'
    environment:
      DATABASE_URL: 'file:/data/radar.db'
      PORT: ${PORT:-3333}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - .:/app
      - /app/node_modules
      - radar-data:/data
    command: sh -c "npx prisma db push --skip-generate && npm run start:dev"
    networks:
      - app-network

  web:
    build:
      context: ../qonect
      dockerfile: Dockerfile.dev
    container_name: qonect-web
    ports:
      - '5173:5173'
    volumes:
      - ../qonect:/app
      - /app/node_modules
    command: sh -c "npm run dev"
    networks:
      - app-network
    depends_on:
      - api

volumes:
  radar-data:

networks:
  app-network:
    driver: bridge
